<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Produtos</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
        <h1>Gerenciamento de Produtos</h1>

        
        <form id="product-form">
            <input type="hidden" id="product-id">
            <div class="form-group">
                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao" required>
            </div>
            <div class="form-group">
                <label for="preco">Preço:</label>
                <input type="number" step="0.01" id="preco" required>
            </div>
            <div class="form-group">
                <label for="categoria">Categoria:</label>
                <input type="text" id="categoria" required>
            </div>
            <div class="form-group">
                <label for="estoque">Estoque:</label>
                <input type="number" id="estoque" required>
            </div>
            <button type="submit" id="btn-salvar">Cadastrar Produto</button>
            <button type="button" id="btn-cancelar" style="display:none;">Cancelar</button>
        </form>

        <h2>Lista de Produtos</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Descrição</th>
                    <th>Preço</th>
                    <th>Categoria</th>
                    <th>Estoque</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="product-list">
                
            </tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
